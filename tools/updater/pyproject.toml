[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "modeltree-updater"
version = "0.1.0"
description = "Proposal-only ModelTree data updater built on Microsoft Agent Framework workflows"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "agent-framework-core>=1.13.0",
]

[project.optional-dependencies]
foundry = [
  "azure-identity>=1.19.0",
  "agent-framework-foundry>=1.10.4",
]
dev = [
  "pytest>=8.0.0",
  # A hard requirement of the suite, not an optional nicety (#357). Three test
  # modules assert properties of `.github/workflows/*.yml` -- the publication
  # workflow's permission model, and the path filters that decide whether the
  # ADR-numbering and instruction-reference guards run at all -- by parsing the
  # YAML, which is what makes "least privilege" and "this guard is triggered"
  # machine-checked instead of claims in prose.
  #
  # Those modules used to open with `pytest.importorskip("yaml", ...)`, so an
  # environment without PyYAML turned every one of them into a skip and still
  # exited 0. A guard whose job is to catch CI silently not checking something
  # must not itself be able to silently not run, so they now `import yaml`
  # unconditionally and its absence is a collection error.
  #
  # Hard-requiring it here rather than in `[project].dependencies` is the whole
  # decision: `yaml` appears nowhere under `src/`, so it is test-only and has no
  # business in the installed wheel. This asks nothing new of contributors --
  # `pip install -e ".[dev]"` (README) and `pip install '.[dev]'`
  # (`.github/workflows/updater-tests.yml`) already install it, so the only
  # environment this newly refuses is one the project never claimed to support.
  "PyYAML>=6.0",
]

[project.scripts]
modeltree-updater = "modeltree_updater.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/modeltree_updater"]
# Only the package. `fixtures/` and `profiles/` are deliberately absent: the
# fixtures are synthetic pages that exist to exercise the pipeline offline, so
# they are test data rather than distribution data and a production artefact
# must not be able to run against fabricated sources by accident. Callers that
# want them pass `--fixtures` at a checkout. Checked by building wheels: while
# `packages` is set, the options that would ship the fixtures are
# `only-include`, `force-include`, `shared-data` and widening `packages`
# itself — 12 fixture files each — whereas `include` and `artifacts` ship none,
# because `packages` has already narrowed what they select from. Widening a key
# that is already permitted adds no key to notice, so
# `tests/test_installed_layout.py` pins this whole table by equality rather
# than by a list of forbidden names. See #139.

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -m 'not network and not live'"
markers = [
  "network: exercises real network egress; opt-in and excluded from the default offline run",
  "live: writes to a real GitHub repository; opt-in and excluded from the default offline run",
]
