    <!-- The same mark as web/public/favicon.svg, drawn with literal colour values.
         GitHub's markdown sanitizer strips embedded style blocks, so a copy that
         relied on CSS custom properties would render here as an unfilled square.
         This copy is standalone on purpose; the site keeps its own.

         Kept in lockstep with the favicon by src/components/brand-mark.test.ts,
         which compares the path data, stroke width and node radii rather than
         trusting this comment. -->
    <rect width="64" height="64" rx="14" fill="#0e1417" />
    <path d="M13 50V17l19 20 19-20v33M32 37V18" fill="none" stroke="#3fd0e6" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="13" cy="17" r="5.5" fill="#e4edf1" />
    <circle cx="32" cy="15" r="5.5" fill="#e4edf1" />
    <circle cx="51" cy="17" r="5.5" fill="#e4edf1" />
