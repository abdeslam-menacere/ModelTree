name: Skills CI

# Runs the deterministic gate self-tests that the data-refresh skills depend on.
#
# Those gates are the only thing standing between an unattended agent run and
# GitHub Pages: they run after the semantic review panel and cannot be outvoted
# by it (ADR 0003). A gate that silently stopped firing would leave the pipeline
# looking green while checking nothing, so the tests prove every rule still
# fires by breaking real data in exactly the way that rule exists to catch.
#
# The job is deliberately NOT filtered by `on.pull_request.paths`. A trigger path
# filter is all-or-nothing: a pull request touching none of the filtered paths
# would report no check at all, and a required check that never reports leaves a
# pull request pending forever rather than passing it. Until #294 this workflow
# was filtered that way, which is why it could not be required however useful its
# gates are — `gate-dataset` enforces rules `web-ci` does not, and an unrequired
# check makes a bad data change visible without stopping it.
#
# So the job starts on every pull request, decides for itself whether the gates
# have anything to read, and finishes green in seconds when they do not. That is
# what makes the `skills-ci` check safe to mark required.
#
# It also runs on every push to `main`, unfiltered by path for that same reason.
# Until #639 the trigger list named no push event, so this check never ran on
# `main` at all: it reported on the pull request and then nothing re-ran it on
# the commit that merged. With `strict` false — see the dated reading below —
# two pull requests can each be green against different bases, merge with no
# textual conflict, and still combine into a gate suite that is broken on `main`
# with nothing there to notice. `web-ci` and `web-e2e` re-run on `main` and would
# catch their own equivalent; this one could not.
#
# Unlike `web-ci`, the scope step below does not diff a push's own range — any
# event other than a pull request runs the gates outright. That is a different
# trade rather than a departure from the pattern: what `web-ci` buys by diffing a
# push is skipping an `npm ci` and a full production build, while these steps
# install nothing and run dependency-free Node scripts, so the run a skip would
# save here is worth less than the coverage it would cost.
#
# The `concurrency` block below already tells the events apart, and needs no
# change for the push trigger: `cancel-in-progress` is true only for a pull
# request, so a `main` run is never cancelled by a later push and every commit on
# `main` keeps its own verdict.
#
# Whether it *is* required is a branch-protection setting that lives outside the
# repository tree, which no workflow file can observe and this one therefore does
# not assert: read it with
# `gh api "repos/{owner}/{repo}/branches/main/protection"`. Measured 2026-09-04
# the required contexts were `web-ci`, `skills-ci`, `web-e2e` and
# `aggregate-checks`, and `strict` was false, dated because an undated claim
# about that setting has no way to learn it has gone false — which is how the
# sentence this replaces came to say the opposite of the truth (#471).
#
# The scope decision should cover everything the gates read, and one part of it
# is pinned to its source: `gate-dataset.mjs` reads exactly one directory —
# `web/src/data` — which is what lets the dataset step below fire on a data
# change at all (#189), and a test derives that directory from the script rather
# than restating it. The rest of the list is maintained by hand and is not known
# to be exhaustive. The scope step below names a gap it is known to have.
#
# It uses no secrets and holds no write scope of any kind.

on:
  pull_request:
  merge_group:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The job id and its name are both the literal `skills-ci`, and there is no
  # matrix, so the reported status check is always exactly `skills-ci`. Renaming
  # either of them breaks any branch protection rule that requires it.
  skills-ci:
    name: skills-ci
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        # The scope step below uses `set -o pipefail` and a here-string, so the
        # shell is named rather than inherited from the runner's default.
        shell: bash
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          # The scope step diffs against the base commit, which a shallow
          # checkout would not contain.
          fetch-depth: 0
          # This job never pushes.
          persist-credentials: false

      - name: Decide whether the gates need to run
        id: scope
        env:
          # Event data reaches the shell as environment variables, never
          # interpolated into the script itself.
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          # Every event that is not a pull request runs the gates outright. The
          # triggers above admit two of those today — a push to `main` and a
          # manual dispatch — and this branch also catches whatever a later edit
          # adds to that list, which is why it tests for the pull request rather
          # than enumerating its complement. A dispatch has no base to diff
          # against at all; a push has one, and the header records why this
          # workflow spends the run rather than narrowing it.
          if [ "$GITHUB_EVENT_NAME" != "pull_request" ]; then
            echo "Event is $GITHUB_EVENT_NAME; running the gates."
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Fail safe. If the changed-file list cannot be computed, run the
          # gates rather than skip them: a green check over a change no gate
          # ever read is the exact failure this workflow exists to remove, and
          # it is worse here than a wasted minute of runner time.
          if ! changed="$(git diff --name-only "$BASE_SHA...$HEAD_SHA")"; then
            echo "Could not diff $BASE_SHA...$HEAD_SHA; running the gates."
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Changed files:"
          echo "$changed"

          # What the three steps below read, so far as this list goes: the gates
          # and their self-tests, the skill documents the doc-count checker
          # scans (`.github/skills/`), the checker itself (`.github/scripts/`),
          # the dataset `gate-dataset.mjs` resolves (`web/src/data/`), and this
          # workflow file, so that a change to it is verified by the workflow it
          # changes.
          #
          # The list is maintained by hand and is NOT known to be exhaustive. It
          # is the set the trigger `paths:` filter carried before #294, kept
          # unchanged, so a path missing from it was already being skipped while
          # this workflow was path-filtered; what #294 changed is that the skip
          # now reports a conclusion instead of no check at all.
          #
          # One gap is known and measured: `gates.test.mjs` reads the committed
          # `tools/updater/profiles/`, which nothing here matches. Renaming the
          # creator id in one of those five profiles — measured on
          # `openai.json` — turns a large block of the self-tests red, so a pull
          # request confined to that directory skips gates the change would have
          # failed. A green skip records that the gates did not run, never that
          # they would have passed. Do not read one as coverage, and widen this
          # pattern before trusting it as such.
          #
          # A change confined to `docs/`, or to this directory's own
          # `README.md`, skips the gates too. Those two are genuine rather than
          # assumed: neither path is read by any gate step, measured by gutting
          # `.github/workflows/README.md` and re-running the gates unchanged.
          #
          # `web/tests/workflows/skills-ci.test.ts` reads this pattern out of
          # the committed file and asserts it covers every dataset document
          # `gate-dataset.mjs` actually loads, at the directory that script
          # resolves — so a new document cannot be added without this decision
          # following it.
          #
          # `.github/agents/` and `.github/copilot-instructions.md` are here for
          # `check-shell-invocations.mjs` below, whose covered set is those two
          # plus `.github/skills/`. A scope pattern narrower than the checker's
          # covered set is a checker that never runs on half of what it claims to
          # guard: the defect it exists to catch -- a shell block an agent cannot
          # parse -- arrives by editing exactly these documents. Neither path is
          # read by any gate step, so they widen this job by one cheap Node
          # process and nothing else (#652).
          #
          # A here-string rather than a pipe: `grep -q` exits on its first match,
          # which can leave the left-hand side of a pipe killed by SIGPIPE and
          # the whole pipeline non-zero under `set -o pipefail`.
          #
          # `grep` exits 0 on a match, 1 on no match and 2 on an error, so
          # truth-testing it with `if` collapses the last two: a matcher that
          # never ran reads exactly like one that ran and matched nothing. Every
          # step below is gated on this output, so that reads as run=false, the
          # gates are skipped, and `skills-ci` -- a required check -- reports
          # green over a change no gate ever read, from the failure of the
          # checker itself. The diff guard above already refuses that trade and
          # runs the gates when it cannot compute an answer; this is the same
          # decision applied to the other way this step can fail to produce one.
          # The three statuses are therefore separated, and anything that is not
          # a clean match-or-no-match runs the gates (#691, after #609).
          set +e
          grep -Eq '^(\.github/skills/|\.github/scripts/|\.github/agents/|\.github/copilot-instructions\.md$|\.github/workflows/skills-ci\.yml$|web/src/data/)' <<< "$changed"
          status=$?
          set -e

          case "$status" in
            0)
              echo "Gate inputs changed; running the gates."
              echo "run=true" >> "$GITHUB_OUTPUT"
              ;;
            1)
              echo "No gate input changed; the gates have nothing to read."
              echo "run=false" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "Could not match the changed-file list (grep exited $status); running the gates."
              echo "run=true" >> "$GITHUB_OUTPUT"
              ;;
          esac

      - name: Set up Node.js
        if: steps.scope.outputs.run == 'true'
        uses: actions/setup-node@v4
        with:
          # Matches web-ci and pages.yml. The gate scripts are dependency-free,
          # so there is nothing to install and no lockfile to cache.
          node-version: 22

      # Node's own test runner, no dependencies. The file path is passed
      # explicitly: `node --test <directory>` resolves differently and fails to
      # find the suite.
      - name: Run the gate self-tests
        if: steps.scope.outputs.run == 'true'
        run: node --test .github/skills/modeltree-gates/scripts/gates.test.mjs

      # The gates are written against the dataset as it actually is, so this step
      # covers two distinct failures: a gate change that no longer matches the
      # data, and a data change that a gate refuses. The second is the reason
      # `web/src/data/` appears in the scope pattern above — until #189 it did
      # not, so this step ran only when the *gates* changed and could never fire
      # on the data change it exists to catch.
      #
      # Whether a red run here blocks a merge is branch protection's answer
      # rather than this file's; the header says where to read it, and says it
      # once. Adding or removing a required context is an owner action either
      # way.
      #
      # It was never #169's to do: `skills-ci` sits outside that issue's scope,
      # which `.github/workflows/README.md` states once under `### What issue
      # #169 covers`, and that is where to read it, so this file and that one
      # cannot drift into disagreeing again. #294 was the prerequisite rather
      # than the outcome: it restructured this workflow on the `web-ci` pattern
      # so the check always reports and is therefore safe to require, and left
      # requiring it to the owner. Landing it did not make this required.
      #
      # That same file records which of these rules `web-ci` already enforces and
      # which it does not, measured rule by rule.
      - name: Run the dataset gate against the live data
        if: steps.scope.outputs.run == 'true'
        run: node .github/skills/modeltree-gates/scripts/gate-dataset.mjs

      # The completeness check for the run ledger (#419, ADR 0006): every commit
      # in this ref's history whose subject declares `(run <id>)` must have a
      # matching entry in `web/src/data/refresh-runs.json`. The /refresh page is
      # the public record of what the unattended pipeline did, and three runs in
      # a row reached it with no entry because writing one was a step a human
      # remembered rather than a step anything enforced.
      #
      # `--history HEAD` rather than the gate's default `refs/remotes/origin/main`.
      # The default is right for an agent working in a clone, which has that
      # remote-tracking ref; `actions/checkout` does not reliably create it, and
      # a gate that exits 2 for want of a ref would have to be either tolerated
      # as a pass -- the one thing this workflow refuses to do -- or left red for
      # a reason having nothing to do with the data. HEAD is the merge result
      # being proposed, so this asserts the property of what would land.
      #
      # This is the completeness half only. The reconciliation half -- that a new
      # entry's record counts match the diff it describes -- is the gate's branch
      # mode, which needs the merge-base with the published main and therefore
      # runs where that ref exists: the publishing agent's clone, as a documented
      # stage of `modeltree-publish`. Do not read a green check here as evidence
      # that any entry's numbers were verified.
      - name: Run the ledger gate over published history
        if: steps.scope.outputs.run == 'true'
        run: node .github/skills/modeltree-gates/scripts/gate-ledger.mjs --history HEAD

      # A claim the panel rejected, on trunk, with nothing reconciling the two
      # (#835). `refresh-runs.json` records a rejection permanently, and the
      # ordinary reviewed pull-request path can land the same record later. That
      # is legitimate -- an ordinary reviewed change is allowed to be more
      # permissive than the automated panel -- but it left two committed
      # documents disagreeing and nothing noticing, which is how nine such
      # reversals accumulated, visible to this gate, before anyone counted them.
      # Nine is what the gate can read, not the population: 17 further rejections
      # it cannot parse also name a record that is present. See the gate header
      # for that measurement -- it is a known, quantified gap, not a clean bill.
      #
      # The step belongs here specifically because this job's scope pattern
      # includes `web/src/data/`. The reversals arrived by ordinary data change,
      # not by a refresh run, so a check wired into the refresh pipeline would
      # have watched the one path they did not take.
      #
      # It gates visibility, never permission: it asks whether
      # `rejection-reversals.json` records the reversal, and has no opinion on
      # whether the objections were well answered. Judging that is a reviewer's
      # job, and a script that claimed to do it would be the more reassuring and
      # the less true. `unanswered` is a first-class disposition for the same
      # reason -- see the header of the gate for why a check that forced a
      # resolution would push its user into inventing one.
      - name: Run the reversal gate over the rejection ledger and the dataset
        if: steps.scope.outputs.run == 'true'
        run: node .github/skills/modeltree-gates/scripts/gate-reversals.mjs

      # The suite above prints its own size on every run, so the documentation
      # does not repeat it. This step is what keeps that true: it refuses a
      # hand-written test count in the skill docs (#276).
      #
      # It is deliberately not a check that the stated number matches the
      # observed one. A count is correct only against one merge-base, so two
      # branches can each add a test, each state a total that is right for
      # themselves, and both go green while their merge is wrong -- which is
      # exactly how the docs came to claim 94 for a 103-test suite. The
      # invariant asserted here has no such hole: "these documents state no
      # count" is true of main and of every branch independently, so it survives
      # any merge and never needs editing when the suite grows.
      #
      # The checker proves its own detector fires before it reads a file, and
      # treats an empty scan as an error, so it cannot pass by matching nothing.
      - name: Refuse a hand-written test count in the skill documentation
        if: steps.scope.outputs.run == 'true'
        run: node .github/scripts/check-skill-doc-test-counts.mjs

      # The `&&` class (#652, after #604 and #614). An agent-facing document that
      # writes `cd web && npm run validate` hands its reader a *parse* error on
      # Windows PowerShell 5.1, which discards the whole block rather than the one
      # line -- and it is invisible to review, because the string is valid in
      # bash, in PowerShell 7, and in every editor. #604 and #614 each fixed the
      # class by sweeping, and a sweep does not stop the next author.
      #
      # This runs on `ubuntu-latest` with the rest of the job, and it is a
      # deterministic scan rather than a real parse. That is decision 2 in the
      # checker's own header, argued there rather than here: `pwsh` on Linux is
      # the wrong instrument because PowerShell 7 *accepts* `&&`, and a
      # `windows-latest` job would make the local half of this repository's
      # pre-merge story -- `ci-preflight.mjs` -- exit 2 for every contributor not
      # on Windows. Read that header before widening or moving this step.
      #
      # Like the checker above it takes no arguments, proves its own rules fire
      # against samples the real 5.1 parser rejected before it reads a file, and
      # treats an empty scan as an error rather than a pass.
      - name: Refuse a shell block an agent-facing document cannot parse
        if: steps.scope.outputs.run == 'true'
        run: node .github/scripts/check-shell-invocations.mjs

      # What pins the fence model of the checker above (#1040). That checker's
      # own self-test feeds command strings straight to the parser and never
      # builds a document, so nothing exercised `fencedBlocks`: tilde support,
      # cross-marker closure, run-length closure, indentation and the exemption
      # lookback were all correct and all unpinned, and an edit narrowing the
      # fence regex to backticks would have passed every check in this job.
      #
      # The suite runs the committed script over fixture corpora in a temporary
      # repository root -- the shipped bytes, not a reimplementation -- and every
      # case carries a stated mutation it is required to go red under.
      #
      # It belongs in *this* job because this job's scope pattern includes
      # `.github/scripts/` as a whole directory. `web-ci` names
      # `ci-preflight.mjs` file by file, so a vitest copy of this suite would
      # never be selected by an edit to the checker it pins -- a guard that is
      # not missing but never chosen, which is the shape #1040 is about.
      - name: Pin the shell guard fence model
        if: steps.scope.outputs.run == 'true'
        run: node --test .github/scripts/check-shell-invocations.test.mjs

      # Gate independence was prose in one file and contradicted by the gate
      # definitions in two others: `.github/copilot-instructions.md` says a gate
      # judges from the issue text and `git diff` only, while both agent
      # definitions told a gate to take its operating policy -- and, for QA, its
      # acceptance criteria -- from `DOCK.md`, a file the party under review
      # writes and can edit (#863). Nothing measured the disagreement, so it sat
      # there through 222 recorded verdicts, protected by the accident that no
      # `DOCK.md` has ever been created rather than by any rule.
      #
      # What this step measures is repository content and not runtime behaviour,
      # and the distinction is load-bearing rather than a hedge: no gate
      # transcript is repository content, so what an agent read at run time
      # cannot be audited here at all. `.github/copilot-instructions.md` argues
      # against pretending otherwise -- a sweep for one spelling reports green
      # while another route returns the same bytes -- so this asserts the
      # narrower thing that *is* versioned text: that every shipped gate
      # definition still carries the permitted-inputs contract verbatim, and
      # that nothing outside those blocks names a route to the developer's own
      # account. The primary assertion is positive rather than a bad-string
      # sweep, which is why there is no exemption marker to widen: the only
      # excluded region is the contract itself, and every byte of it is pinned.
      #
      # Like the two checkers above it takes no arguments, proves each of its
      # rules fires against a sample and stays silent on a control before it
      # reads a file, and treats an empty scan as an error rather than a pass.
      # Read the checker's own header before widening it.
      - name: Refuse a gate definition that reads the party under review
        if: steps.scope.outputs.run == 'true'
        run: node .github/scripts/check-gate-independence.mjs

      # Two gates dispatched against the *same* dock worktree overwrite each
      # other's arm mutations, and whole-file restore makes it silent: a restore
      # reverts the file, not the caller's edit, so one gate's cleanup reverts
      # the other's live mutation with no error and nothing in either transcript
      # (abdeslam-menacere/ModelTree#1056). Three of the four interleavings are
      # loud and cost a cycle; the fourth is quiet and certifies a guard that
      # catches nothing, because the measuring gate reads its neighbour's
      # mutation as its own red arm.
      #
      # `gate-arm-guard.mjs` is what a gate runs immediately before reading any
      # arm's exit code, so it never runs in CI on its own account. That is
      # exactly the shape #1040 is about -- a guard that is not missing but is
      # never chosen -- so its `self-test` is run here: the comparison is
      # exercised over a clean pair that must yield no finding and one planted
      # discrepancy per finding kind that must yield exactly that kind at
      # exactly that path, with each planted arm required to come back differing
      # from the clean one. A check nobody has seen fire is not a check.
      #
      # It belongs in *this* job because this job's scope pattern includes
      # `.github/scripts/` and `.github/agents/` as whole directories, so an
      # edit to either the guard or the two gate definitions that mandate it
      # selects this step.
      - name: Prove the gate arm contamination guard still fires
        if: steps.scope.outputs.run == 'true'
        run: node .github/scripts/gate-arm-guard.mjs self-test

      # The step that turns a skip into a *report*. Without it a pull request
      # touching no gate input would run a job with every step skipped, and the
      # point of the restructure is that the check always concludes.
      - name: Record that no gate run was needed
        if: steps.scope.outputs.run != 'true'
        run: |
          echo 'No gate, script, or dataset file changed, so the gates were not run.' >> "$GITHUB_STEP_SUMMARY"
