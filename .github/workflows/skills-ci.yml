name: Skills CI

# Runs the deterministic gate self-tests that the data-refresh skills depend on.
#
# Those gates are the only thing standing between an unattended agent run and
# GitHub Pages: they run after the semantic review panel and cannot be outvoted
# by it (ADR 0003). A gate that silently stopped firing would leave the pipeline
# looking green while checking nothing, so the tests prove every rule still
# fires by breaking real data in exactly the way that rule exists to catch.
#
# Path-filtered on purpose. Unlike `web-ci`, this check is NOT required on main,
# so a pull request that never reports one is fine; filtering keeps it off the
# many pull requests that touch neither the gates nor the data those gates read.
#
# The filter must therefore list both. `gate-dataset.mjs` reads exactly one
# directory — `web/src/data` — so that path is what makes the dataset step below
# able to fire at all.
#
# It uses no secrets and holds no write scope of any kind.

on:
  pull_request:
    paths:
      - '.github/skills/**'
      - '.github/workflows/skills-ci.yml'
      # The dataset the gates are run against. Without this, the dataset step
      # below could never fire on a data change (#189).
      - 'web/src/data/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  skills-ci:
    name: skills-ci
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          # This job never pushes.
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          # Matches web-ci and pages.yml. The gate scripts are dependency-free,
          # so there is nothing to install and no lockfile to cache.
          node-version: 22

      # Node's own test runner, no dependencies. The file path is passed
      # explicitly: `node --test <directory>` resolves differently and fails to
      # find the suite.
      - name: Run the gate self-tests
        run: node --test .github/skills/modeltree-gates/scripts/gates.test.mjs

      # The gates are written against the dataset as it actually is, so this step
      # covers two distinct failures: a gate change that no longer matches the
      # data, and a data change that a gate refuses. The second is the reason
      # `web/src/data/**` appears in the trigger paths above — until #189 it did
      # not, so this step ran only when the *gates* changed and could never fire
      # on the data change it exists to catch.
      #
      # What it does not do is block. `skills-ci` is not a required check, so a
      # red run here is visible but does not stop auto-merge; making it required
      # is #169, and needs the repository owner. `.github/workflows/README.md`
      # records which of these rules `web-ci` already enforces and which it does
      # not, measured rule by rule.
      - name: Run the dataset gate against the live data
        run: node .github/skills/modeltree-gates/scripts/gate-dataset.mjs
