name: ADR numbers

# Refuses two files under docs/adr/ that claim the same four-digit number, and a
# decision record whose `# ADR NNNN:` heading disagrees with its own filename.
#
# Git compares paths, so `0003-one-title.md` and `0003-another-title.md` do not
# touch and both merge clean -- which is how #145 and #146 nearly left two
# contradictory ADR 0003s on main with no signal. "ADR 0003" then stops being a
# unique reference, and an agent told to follow it finds two documents and no way
# to tell which governs. The existing instruction-references check does not cover
# this: it asserts a citation resolves, and both files exist, so both resolve.
#
# The checker is standard library only, so this job installs nothing and reaches
# no network. It is path-filtered, and therefore reports no check at all on a
# pull request that does not touch docs/adr/: it must not be added to branch
# protection, because a required check that never reports leaves a pull request
# pending forever. See .github/workflows/README.md.
#
# It also runs on `merge_group`, unfiltered, and that trigger is the point of
# the merge queue rather than a detail of it. The collision this refuses is a
# *race*: two pull requests each green against a `main` that does not yet carry
# the other's ADR, both merging, and the pair colliding only in the merged
# result -- which is the state a merge queue exists to test, by re-running the
# checks against each projected merge before it lands
# (abdeslam-menacere/ModelTree#860). A queue that tested each entry with only
# the four required contexts, none of which reads an ADR number, would pass the
# collision straight through and close nothing.
#
# GitHub does not support `paths:` on `merge_group`, so the choice there is
# unfiltered or absent, and absent is the option that reopens the race. The cost
# is that this job runs on every queue entry, including entries that touch no
# ADR: it is standard library only and finishes in seconds, so the queue pays
# almost nothing for it.

on:
  pull_request:
    paths:
      - 'docs/adr/**'
      - 'tools/adr_numbers/**'
      - '.github/workflows/adr-numbers.yml'
  merge_group:
  push:
    branches:
      - main
    paths:
      - 'docs/adr/**'
      - 'tools/adr_numbers/**'
      - '.github/workflows/adr-numbers.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  adr-numbers:
    name: adr-numbers
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      # No arguments: the default target is docs/adr, so the job cannot be
      # pointed at an emptier directory than the real one.
      - name: Check that no two ADRs claim the same number, and each agrees with its own
        run: python tools/adr_numbers/check_adr_numbers.py
