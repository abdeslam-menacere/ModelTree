name: Instruction references

# Resolves the references made by .github/copilot-instructions.md -- the file
# every agent is required to read first -- and the issue citations made by every
# .github/skills/**/*.md, which are the instructions an agent follows while
# acting as a gate. A pointer that resolves to nothing is how `SPEC.md` survived,
# and an agent that follows one has no signal about what to do next, so it
# guesses. The checker's module docstring records which rules apply to which
# document and why the two groups differ.
#
# The checker is standard library only, so this job installs nothing and reaches
# no network. It is path-filtered, and therefore reports no check at all on a
# pull request that does not touch the file: it must not be added to branch
# protection, because a required check that never reports leaves a pull request
# pending forever. See .github/workflows/README.md.

on:
  pull_request:
    paths:
      - '.github/copilot-instructions.md'
      - '.github/skills/**'
      - 'tools/instruction_refs/**'
      - '.github/workflows/instruction-references.yml'
  push:
    branches:
      - main
    paths:
      - '.github/copilot-instructions.md'
      - '.github/skills/**'
      - 'tools/instruction_refs/**'
      - '.github/workflows/instruction-references.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  instruction-references:
    name: instruction-references
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      # No arguments: the target is the whole covered set, so the job cannot be
      # pointed at something easier.
      - name: Resolve the references in the covered documents
        run: python tools/instruction_refs/check_instruction_references.py
