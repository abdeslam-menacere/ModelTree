name: Web E2E

# The browser half of the web suite: overlap and clipping at 320 CSS px, the
# keyboard journey through the lineage explorer and its drawer, reduced motion,
# and axe accessibility scans at desktop and mobile widths. Issue #14 asks for
# all four by name, and none of them can be answered in jsdom -- there,
# `getBoundingClientRect` returns a box for an element that is never painted, so
# a geometry assertion passes whether or not the page is broken.
#
# Why this is a separate workflow rather than steps in web-ci.yml:
#
#   * `web-ci` is a required check, and `web/tests/workflows/web-ci.test.ts`
#     expands web/package.json and asserts that job's steps decompose to exactly
#     `npm run build`. Adding an e2e step there fails that test by design.
#   * `npm run build` is `npm run validate && astro build`, so putting Playwright
#     inside `validate` would put a browser download inside every contributor's
#     and every agent's build. That cost belongs to this job alone.
#
# The consequence is stated rather than hidden: `web-e2e` is a **new, separate**
# status. It reports on every pull request and goes red when the suite fails.
# Whether that red blocks a merge is a property of branch protection -- a
# repository setting this file cannot read and does not assert here.
#
# Like web-ci.yml, this is deliberately NOT filtered by `on.pull_request.paths`.
# A trigger path filter is all-or-nothing: a pull request touching no web/ file
# would report no check at all, and a check that never reports leaves a pull
# request that requires it pending forever (#80). The job starts on every pull
# request and decides for itself whether the browsers are worth installing.
#
# It uses no secrets and holds no write scope of any kind.

on:
  pull_request:
  merge_group:
  push:
    branches:
      - main
  workflow_dispatch:

# Least privilege, set at the top so no job can start from a wider default.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The job id and its name are both the literal `web-e2e`, so the reported
  # status check is always exactly `web-e2e`. Renaming either would break any
  # branch protection rule that comes to require it.
  web-e2e:
    name: web-e2e
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
        working-directory: web
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          # The scope step diffs against the base commit, which a shallow
          # checkout would not contain.
          fetch-depth: 0
          # This job never pushes, so the checkout keeps no credentials.
          persist-credentials: false

      - name: Decide whether the browser suite needs to run
        id: scope
        # Overrides the job default: the diff is taken at the repository root.
        working-directory: .
        env:
          # Event data reaches the shell as environment variables, never
          # interpolated into the script itself.
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail

          case "$GITHUB_EVENT_NAME" in
            pull_request)
              base="$PR_BASE_SHA"
              head="$PR_HEAD_SHA"
              ;;
            push)
              base="$PUSH_BEFORE_SHA"
              head="$GITHUB_SHA"
              ;;
            *)
              echo "Event is $GITHUB_EVENT_NAME, which has no base; running the full browser suite."
              echo "run=true" >> "$GITHUB_OUTPUT"
              exit 0
              ;;
          esac

          # Fail safe. If the changed-file list cannot be computed, run rather
          # than skip: reporting green for work that was never verified is the
          # failure this repository keeps finding. A branch-creating push carries
          # an all-zero "before" naming no commit, and a force-push can leave one
          # that is no longer an ancestor; both land here rather than skipping.
          if ! changed="$(git diff --name-only "$base...$head")"; then
            echo "Could not diff $base...$head; running the full browser suite."
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Changed files:"
          echo "$changed"

          # A here-string rather than a pipe: `grep -q` exits on its first match,
          # which can leave the left-hand side of a pipe killed by SIGPIPE and
          # the whole pipeline non-zero under `set -o pipefail`.
          #
          # `grep` exits 0 on a match, 1 on no match and 2 on an error, so
          # truth-testing it with `if` collapses the last two: a matcher that
          # never ran reads exactly like one that ran and matched nothing. Every
          # step below is gated on this output, so that reads as run=false, the
          # browser suite is skipped, and `web-e2e` -- a required check --
          # reports green over a commit it never exercised, from the failure of
          # the checker itself. The diff guard above already refuses that trade
          # and runs when it cannot compute an answer; this is the same decision
          # applied to the other way this step can fail to produce one. The three
          # statuses are therefore separated, and anything that is not a clean
          # match-or-no-match runs the suite (#691, after #609).
          set +e
          grep -Eq '^(web/|\.github/workflows/web-e2e\.yml$)' <<< "$changed"
          status=$?
          set -e

          case "$status" in
            0)
              echo "Web files changed; running the browser suite."
              echo "run=true" >> "$GITHUB_OUTPUT"
              ;;
            1)
              echo "No web files changed; nothing to exercise."
              echo "run=false" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "Could not match the changed-file list (grep exited $status); running the browser suite."
              echo "run=true" >> "$GITHUB_OUTPUT"
              ;;
          esac

      - name: Set up Node.js
        if: steps.scope.outputs.run == 'true'
        uses: actions/setup-node@v4
        with:
          # Kept identical to web-ci.yml and pages.yml.
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        if: steps.scope.outputs.run == 'true'
        run: npm ci

      # Chromium only. The suite asserts computed geometry, accessibility-tree
      # facts and media-query behaviour, none of which is engine-specific in a
      # way a second browser would usefully disagree about -- and a second
      # browser doubles the download on every run for that.
      - name: Install the Chromium build Playwright pins
        if: steps.scope.outputs.run == 'true'
        run: npx playwright install --with-deps chromium

      # `playwright.config.ts` builds the site and serves it with `astro
      # preview`, so this exercises the real production output rather than the
      # dev server, whose toolbar is a fixed overlay in front of the layout
      # being measured. BASE_PATH is deliberately unset here: the suite
      # navigates to `/`, and the base-path build is already covered by
      # `web/tests/build/base-path.test.ts`.
      - name: Run the browser and accessibility suite
        if: steps.scope.outputs.run == 'true'
        run: npm run test:e2e

      # Traces and failure screenshots, uploaded only when something failed.
      # Nothing is uploaded by a green run, and no screenshot is a baseline --
      # the suite compares numbers, not pixels.
      - name: Upload the Playwright report
        if: failure() && steps.scope.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: web-e2e-report
          path: |
            web/playwright-report
            web/test-results
          if-no-files-found: ignore
          retention-days: 7

      - name: Record that no browser run was needed
        if: steps.scope.outputs.run != 'true'
        run: |
          echo 'No files under `web/` changed, so the browser suite did not run.' >> "$GITHUB_STEP_SUMMARY"
