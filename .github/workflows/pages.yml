name: Deploy personal GitHub Pages site

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Least privilege, set at the top so no job can start from a wider default. Each
# job below widens this for itself and no further.
permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

# The alert's identity, defined once for the whole workflow. `report-failure`
# files under this exact title and `report-recovery` closes what matches it
# exactly, so the two look up the same issue by construction. Restating the
# string in either job would let them drift apart, and a recovery job matching a
# title the failure job no longer uses would close somebody else's issue.
env:
  STALE_SITE_TITLE: 'GitHub Pages deploy failed - the published site is stale'

jobs:
  deploy:
    if: github.repository == 'abdeslam-menacere/ModelTree'
    runs-on: ubuntu-latest
    permissions:
      # Read the code to build the site.
      contents: read
      # Publish the built site.
      pages: write
      # Mint the OIDC token actions/deploy-pages exchanges for a deployment.
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    defaults:
      run:
        working-directory: web
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build Astro site
        run: npm run build
        env:
          SITE_URL: https://abdeslam-menacere.github.io
          BASE_PATH: /ModelTree/

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # A failed deploy used to be silent. `npm run build` is
  # `npm run validate && astro build`, so a red web suite on main stops the
  # deploy step, and GitHub Pages simply keeps serving the previous successful
  # build. The site does not break, it freezes: stale content, healthy
  # appearance, and no signal anywhere except a red run in the Actions tab. For
  # a project whose whole purpose is being up to date, that is the worst
  # available failure mode, so it becomes an issue you cannot miss.
  report-failure:
    name: Report a stale site
    needs: deploy
    if: failure() && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # File and update the stale-site issue. This is the only repository write
      # in this workflow other than the Pages deployment itself, and only this
      # job holds it.
      issues: write
    steps:
      - name: Open or update the stale-site issue
        env:
          # The job token, scoped by the permissions block above to issues only.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          FAILED_SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail

          {
            echo "The deploy job in \`pages.yml\` failed, so GitHub Pages is still serving the"
            echo "previous successful build. The site is **stale, not broken** - it will go on"
            echo "looking perfectly healthy until this is fixed."
            echo
            echo "- Failing commit: \`$FAILED_SHA\`"
            echo "- Failed run: $RUN_URL"
            echo
            echo "\`pages.yml\` builds with \`npm run build\`, which is"
            echo "\`npm run validate && astro build\`. A failure here is usually the web test"
            echo "suite or the Astro and TypeScript diagnostics going red on \`main\`. Fixing"
            echo "that and pushing to \`main\` redeploys and unfreezes the site."
          } > "$RUNNER_TEMP/stale-site.md"

          # Narrow with search, then match the title exactly, so a repeated
          # failure comments on the open report instead of filing a duplicate
          # on every push.
          existing="$(gh issue list --repo "$REPO" --state open --search "\"$STALE_SITE_TITLE\" in:title" --json number,title \
            | jq -r --arg t "$STALE_SITE_TITLE" 'map(select(.title == $t)) | .[0].number // empty')"

          if [ -n "$existing" ]; then
            echo "Commenting on existing issue #$existing."
            gh issue comment "$existing" --repo "$REPO" --body-file "$RUNNER_TEMP/stale-site.md"
          else
            echo "Opening a new stale-site issue."
            gh issue create --repo "$REPO" --title "$STALE_SITE_TITLE" --body-file "$RUNNER_TEMP/stale-site.md"
          fi

  # An alert that never resolves is one you learn to ignore. `report-failure`
  # opens the stale-site issue but nothing ever closed it, so an open alert
  # stopped meaning "the site is stale right now" and started meaning nothing at
  # all. This job is its mirror image: a deploy that succeeds on `main` has
  # unfrozen the site, so the alert it raised is answered and closed here.
  report-recovery:
    name: Resolve the stale-site alert
    needs: deploy
    # `needs.deploy.result` rather than `success()`, which is also true when a
    # needed job was *skipped* - as `deploy` is on a fork, where its
    # `github.repository` guard does not hold. A deploy that never ran has not
    # unfrozen anything and must not resolve an alert.
    #
    # The ref check is the same clause `report-failure` uses, and it is
    # load-bearing in the other direction here: `deploy` carries no ref guard of
    # its own, so a `workflow_dispatch` from a branch really does deploy that
    # branch. Closing a genuine alert off the back of that would report the site
    # recovered when `main` is still broken.
    if: needs.deploy.result == 'success' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      # Resolve the stale-site issue, and nothing else. Every scope left out of
      # a job-level block is `none`, so this job cannot deploy, cannot mint an
      # OIDC token, and cannot read repository contents - it never checks out.
      issues: write
    steps:
      - name: Close the stale-site issue
        env:
          # The job token, scoped by the permissions block above to issues only.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          RECOVERED_SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail

          # The same lookup `report-failure` files under, deliberately character
          # for character: narrow with search, then match the title exactly. A
          # looser rule here would close whatever the search happened to return.
          existing="$(gh issue list --repo "$REPO" --state open --search "\"$STALE_SITE_TITLE\" in:title" --json number,title \
            | jq -r --arg t "$STALE_SITE_TITLE" 'map(select(.title == $t)) | .[0].number // empty')"

          if [ -z "$existing" ]; then
            echo "No stale-site issue is open; nothing to resolve."
            exit 0
          fi

          {
            echo "The deploy job in \`pages.yml\` succeeded, so GitHub Pages is serving the"
            echo "current build again. The site is no longer stale, and this alert is"
            echo "answered."
            echo
            echo "- Recovering commit: \`$RECOVERED_SHA\`"
            echo "- Successful run: $RUN_URL"
          } > "$RUNNER_TEMP/site-recovered.md"

          echo "Resolving issue #$existing."
          gh issue comment "$existing" --repo "$REPO" --body-file "$RUNNER_TEMP/site-recovered.md"
          gh issue close "$existing" --repo "$REPO" --reason completed
