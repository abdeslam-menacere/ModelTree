name: Updater tests

# Runs the tools/updater pytest suite on pull requests that touch it.
# The job installs the package itself, so an unsatisfiable dependency pin or a
# broken pyproject.toml fails here instead of at review time.
# It uses no secrets and never reaches a model endpoint: the fixture providers
# under tools/updater/fixtures keep the suite offline.
#
# It also runs on `merge_group`, unfiltered. GitHub does not support `paths:` on
# that event, so a workflow either runs on every queue entry or on none, and a
# queue enforces exactly the checks that report against each projected merge
# (abdeslam-menacere/ModelTree#860). This suite asserts the structure of
# adr-numbers.yml, instruction-references.yml and publish-updater-proposals.yml
# as well as the updater itself, so it is one of the checks that can catch a
# pair of pull requests that only conflict once merged -- which is the state
# only the queue tests. Unfiltered means it also runs on entries that touch
# nothing it covers; that costs an install and a short suite, which is the price
# of the event not carrying a path filter.

on:
  pull_request:
    paths:
      - 'tools/updater/**'
      - '.github/workflows/updater-tests.yml'
      # The suite asserts this workflow's permission model, so a change to it
      # has to re-run the suite.
      - '.github/workflows/publish-updater-proposals.yml'
      # And it asserts the behaviour of the instruction-reference checker, which
      # lives outside tools/updater because it is not an updater concern.
      - 'tools/instruction_refs/**'
      # That checker's covered set is *derived from* the skills directory rather
      # than listed, so the suite's guard on the covered set -- and the checker's
      # refusal of a run that discovers nothing there -- are both assertions
      # about these files. Without this filter a pull request that renamed or
      # emptied the directory would be the one pull request that never ran the
      # test written to catch it. Same arrangement, and same reason, as
      # `docs/adr/**` below.
      - '.github/skills/**'
      # The suite also asserts that workflow's own path filter, on the principle
      # that a covered document CI never triggers on is not covered, so a change
      # to it has to re-run the suite that checks it.
      - '.github/workflows/instruction-references.yml'
      # Same arrangement for the ADR number checker and the workflow that runs
      # it, whose structure the suite also asserts. `docs/adr/**` is here
      # because the suite checks the committed decision records themselves: a
      # pull request that lands a colliding number must turn this red too, not
      # only the dedicated workflow.
      - 'tools/adr_numbers/**'
      - '.github/workflows/adr-numbers.yml'
      - 'docs/adr/**'
  merge_group:
  push:
    branches:
      - main
    paths:
      - 'tools/updater/**'
      - '.github/workflows/updater-tests.yml'
      - '.github/workflows/publish-updater-proposals.yml'
      - 'tools/instruction_refs/**'
      - '.github/skills/**'
      - '.github/workflows/instruction-references.yml'
      - 'tools/adr_numbers/**'
      - '.github/workflows/adr-numbers.yml'
      - 'docs/adr/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    working-directory: tools/updater

jobs:
  pytest:
    name: pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The floor declared by requires-python, and the current release.
        python-version: ['3.11', '3.13']
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # Deliberately uncached and non-editable: the install must resolve
      # dependencies and build the wheel from scratch on every run.
      - name: Install the updater and its test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install '.[dev]'

      - name: Run pytest
        run: pytest

      # The unsatisfiable pin that shipped in #68 was in an optional group.
      # Resolving the extras (without installing Azure packages into the test
      # environment) keeps that class of error machine-detectable.
      - name: Check the optional dependency groups still resolve
        run: python -m pip install --dry-run --quiet '.[foundry]'
