name: Web CI

# Verifies the Astro site under web/ on every pull request, running exactly what
# the Pages deploy gates on.
#
# Before this workflow existed, web verification ran only inside pages.yml, on
# push to main, after the merge. A failing data change therefore merged clean and
# then stopped the deploy step, leaving GitHub Pages serving the previous build:
# a frozen site rather than a broken one, healthy-looking, with no signal on the
# pull request that caused it.
#
# The job is deliberately NOT filtered by `on.pull_request.paths`. A trigger path
# filter is all-or-nothing: a pull request touching no web/ file would report no
# check at all, and a required check that never reports leaves a pull request
# pending forever. So the job starts on every pull request, decides for itself
# whether the build is needed, and finishes green in seconds when it is not.
# That is what makes the `web-ci` check safe to mark required.
#
# It uses no secrets and holds no write scope of any kind.

on:
  pull_request:
  workflow_dispatch:

# Least privilege, set at the top so no job can start from a wider default. This
# workflow cannot write repository content.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The job id and its name are both the literal `web-ci`, and there is no
  # matrix, so the reported status check is always exactly `web-ci`. Renaming
  # either of them breaks every branch protection rule that requires it.
  web-ci:
    name: web-ci
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
        working-directory: web
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          # The scope step diffs against the base commit, which a shallow
          # checkout would not contain.
          fetch-depth: 0
          # This job never pushes, so the checkout keeps no credentials.
          persist-credentials: false

      - name: Decide whether the web build needs to run
        id: scope
        # Overrides the job default: the diff is taken at the repository root.
        working-directory: .
        env:
          # Event data reaches the shell as environment variables, never
          # interpolated into the script itself.
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          # A manual dispatch has no base to diff against, so it always builds.
          if [ "$GITHUB_EVENT_NAME" != "pull_request" ]; then
            echo "Event is $GITHUB_EVENT_NAME; running the full web build."
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Fail safe. If the changed-file list cannot be computed, build rather
          # than skip: reporting green for work that was never verified is the
          # exact failure this workflow exists to remove.
          if ! changed="$(git diff --name-only "$BASE_SHA...$HEAD_SHA")"; then
            echo "Could not diff $BASE_SHA...$HEAD_SHA; running the full web build."
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Changed files:"
          echo "$changed"

          # web/ is the site itself. This workflow file is included so that a
          # change to it is verified by the workflow it changes. Nothing else
          # matches, so a pull request confined to tools/updater/ skips the
          # build entirely.
          #
          # A here-string rather than a pipe: `grep -q` exits on its first match,
          # which can leave the left-hand side of a pipe killed by SIGPIPE and
          # the whole pipeline non-zero under `set -o pipefail`.
          if grep -Eq '^(web/|\.github/workflows/web-ci\.yml$)' <<< "$changed"; then
            echo "Web files changed; running the full web build."
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "No web files changed; nothing to build."
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Node.js
        if: steps.scope.outputs.run == 'true'
        uses: actions/setup-node@v4
        with:
          # Kept identical to pages.yml: this check is only meaningful if it
          # builds on the same runtime the deploy uses.
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        if: steps.scope.outputs.run == 'true'
        run: npm ci

      # `npm run build` is `npm run validate && astro build`, so this single
      # command runs the vitest suite, the Astro and TypeScript diagnostics, and
      # the static build. It is precisely what pages.yml gates the deploy on,
      # with the same site variables, so a green check here means main can
      # actually deploy.
      - name: Validate and build the site
        if: steps.scope.outputs.run == 'true'
        run: npm run build
        env:
          SITE_URL: https://abdeslam-menacere.github.io
          BASE_PATH: /ModelTree/

      - name: Record that no web build was needed
        if: steps.scope.outputs.run != 'true'
        run: |
          echo 'No files under `web/` changed, so the site was not rebuilt.' >> "$GITHUB_STEP_SUMMARY"
