name: Web CI

# Verifies the Astro site under web/ on every pull request and on every push to
# main, running exactly what the Pages deploy gates on.
#
# Before this workflow existed, web verification ran only inside pages.yml, on
# push to main, after the merge. A failing data change therefore merged clean and
# then stopped the deploy step, leaving GitHub Pages serving the previous build:
# a frozen site rather than a broken one, healthy-looking, with no signal on the
# pull request that caused it.
#
# The job is deliberately NOT filtered by `on.pull_request.paths`. A trigger path
# filter is all-or-nothing: a pull request touching no web/ file would report no
# check at all, and a required check that never reports leaves a pull request
# pending forever. So the job starts on every pull request, decides for itself
# whether the build is needed, and finishes green in seconds when it is not.
# That is what makes the `web-ci` check safe to mark required.
#
# The push trigger overlaps pages.yml, which also builds main on every push, and
# that overlap was deliberately avoided here until now: a second full build per
# merge is real cost for a build that is already happening. Issue #5 asks for it,
# and the reasons hold up on their own:
#
#   * pages.yml's build is a step of a deployment, not a check. Its deploy job is
#     gated on `github.repository`, so on a fork main is verified by nothing at
#     all; and when that job goes red the run name says the deploy failed, which
#     is also what it says when Pages itself is broken. "The site is wrong" and
#     "publishing is wrong" have different owners and different fixes, and one
#     red X cannot mean both.
#   * A status named `web-ci` that exists only on pull requests cannot answer
#     "was this commit of main verified?" unless the reader already knows the
#     answer lives inside a deploy workflow. A direct push to main -- which
#     branch protection still permits for administrators -- gets no pull request
#     check at all.
#
# That cost is paid down rather than accepted whole. The scope step below runs on
# a push exactly as it does on a pull request, diffing the pushed range, so the
# duplicate build happens only on a main push that actually touched web/. A
# docs-only or tools-only merge finishes green in seconds.
#
# It uses no secrets and holds no write scope of any kind.

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

# Least privilege, set at the top so no job can start from a wider default. This
# workflow cannot write repository content.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Superseded pull request runs are cancelled, because only the head commit's
  # verdict is ever read. Main runs are not: every commit on main is verified on
  # its own, and cancelling one would leave a commit whose check never reported.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The job id and its name are both the literal `web-ci`, and there is no
  # matrix, so the reported status check is always exactly `web-ci`. Renaming
  # either of them breaks every branch protection rule that requires it.
  web-ci:
    name: web-ci
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
        working-directory: web
    # The site variables pages.yml builds with. They sit at job level rather than
    # on one step because the deploy sets them once for a single `npm run build`
    # that runs the tests, the diagnostics and the build together; splitting that
    # into three steps here must not quietly hand one of them a different
    # environment. At job level a new verification step inherits them by
    # construction instead of by whoever adds it remembering to.
    env:
      SITE_URL: https://abdeslam-menacere.github.io
      BASE_PATH: /ModelTree/
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          # The scope step diffs against the base commit, which a shallow
          # checkout would not contain.
          fetch-depth: 0
          # This job never pushes, so the checkout keeps no credentials.
          persist-credentials: false

      - name: Decide whether the web build needs to run
        id: scope
        # Overrides the job default: the diff is taken at the repository root.
        working-directory: .
        env:
          # Event data reaches the shell as environment variables, never
          # interpolated into the script itself.
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail

          # The range to diff. A pull request compares its head against its base;
          # a push compares against whatever the branch pointed at before it.
          case "$GITHUB_EVENT_NAME" in
            pull_request)
              base="$PR_BASE_SHA"
              head="$PR_HEAD_SHA"
              ;;
            push)
              base="$PUSH_BEFORE_SHA"
              head="$GITHUB_SHA"
              ;;
            *)
              # A manual dispatch has no base to diff against, so it always builds.
              echo "Event is $GITHUB_EVENT_NAME, which has no base; running the full web build."
              echo "run=true" >> "$GITHUB_OUTPUT"
              exit 0
              ;;
          esac

          # Fail safe. If the changed-file list cannot be computed, build rather
          # than skip: reporting green for work that was never verified is the
          # exact failure this workflow exists to remove. A push that creates a
          # branch carries an all-zero "before" naming no commit, and a
          # force-push can leave one that is no longer an ancestor; both land
          # here rather than skipping.
          if ! changed="$(git diff --name-only "$base...$head")"; then
            echo "Could not diff $base...$head; running the full web build."
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Changed files:"
          echo "$changed"

          # The question this asks is "could this change break something the web
          # suite verifies?", not "did the site's own sources change?". Those
          # were the same question while every test under web/ tested web/, and
          # web/tests/workflows/ ended that: the test whose whole subject is
          # skills-ci.yml did not run when skills-ci.yml changed, so the guard
          # existed and was never selected (#477).
          #
          # The list below is therefore derived rather than intuited. It is
          # every path outside web/ that a file under web/ reads, obtained in
          # two passes: resolve each relative path literal in web/ against its
          # own file and keep the ones that escape web/, then follow every
          # module web/ imports from outside web/ and scan that module's own
          # path literals too. The second pass is not optional. A path a test
          # reaches *through* an import has no literal anywhere under web/, so
          # the first pass alone is structurally unable to see it -- which is
          # how tools/updater/profiles/ was missed when this list was first
          # derived. Each entry, with its reader:
          #
          #   .github/workflows/
          #       every .yml is parsed by tests/workflows/ci-preflight.test.ts,
          #       and README.md is read by web-ci.test.ts and skills-ci.test.ts,
          #       so the whole directory qualifies rather than a file list
          #   .github/scripts/ci-preflight.mjs      ci-preflight.test.ts
          #   .github/skills/modeltree-gates/scripts/gate-dataset.mjs
          #       tests/workflows/skills-ci.test.ts
          #   .github/skills/modeltree-gates/scripts/gate-evidence.mjs
          #       src/data/featured-creator-profile.test.ts, which imports it
          #   tools/updater/profiles/<name>.json
          #       the same test, reached through that import rather than by a
          #       literal of its own: the imported reviewedCreatorIds() reads
          #       this directory off disk, so a profile document changes the
          #       set the test asserts over. Top-level *.json only, because
          #       that read is not recursive and skips anything that is not a
          #       file, so generic/ and origins/ cannot change its answer. The
          #       extension is matched case-insensitively on purpose: a name
          #       differing from ".json" only in case makes that reader throw
          #       rather than skip it (#246), and a throw reddens the test as
          #       surely as a wrong value does.
          #   .github/skills/modeltree-gates/scripts/gate-scope.mjs
          #       tests/contributing/issue-forms.test.ts
          #   .github/skills/modeltree-review/SKILL.md
          #       src/data/organization-type-policy.test.ts and
          #       src/data/osi-approved-evidence-policy.test.ts
          #   .github/ISSUE_TEMPLATE/               issue-forms.test.ts
          #   .github/CODEOWNERS                    issue-forms.test.ts
          #   .github/pull_request_template.md      issue-forms.test.ts
          #   CONTRIBUTING.md                       issue-forms.test.ts
          #   docs/contributing/minimal-dataset-example.json
          #       issue-forms.test.ts
          #   docs/product/INFORMATION-ARCHITECTURE.md
          #       src/data/catalog-inclusion-policy.test.ts,
          #       src/data/featured-policy.test.ts and
          #       src/data/organization-type-policy.test.ts
          #   docs/product/FRESHNESS-POLICY.md
          #       src/data/freshness-policy.test.ts
          #
          # Named files rather than whole directories wherever the directory
          # also holds files no web/ test reads. .github/skills/ is the case
          # that matters: matching it whole would build the site for a SKILL.md
          # nothing here opens, and the point of this step is to skip work that
          # cannot change the answer. tools/updater/profiles/ is that same
          # shape one level down, which is why the entry above names the *.json
          # documents in that one directory rather than the directory itself.
          #
          # Still deliberately unmatched: the rest of tools/updater/, docs/adr/,
          # .github/copilot-instructions.md, and every other document under
          # docs/. Their checks live elsewhere -- for the Python package that is
          # updater-tests.yml, which this step does not affect either way.
          #
          # Add a test under web/ that reads a new path outside web/, and add it
          # here in the same change -- otherwise that test will not run when its
          # own subject changes, which is the defect above, restored.
          # `web/tests/workflows/web-ci.test.ts` pins every entry in this list.
          #
          # A here-string rather than a pipe: `grep -q` exits on its first match,
          # which can leave the left-hand side of a pipe killed by SIGPIPE and
          # the whole pipeline non-zero under `set -o pipefail`.
          #
          # `grep` exits 0 on a match, 1 on no match and 2 on an error, so
          # truth-testing it with `if` collapses the last two: a matcher that
          # never ran reads exactly like one that ran and matched nothing. Every
          # step below is gated on this output, so that reads as run=false, the
          # whole suite is skipped, and the check reports green over work
          # nothing verified -- from the failure of the checker itself. The diff
          # guard above already refuses that trade and builds instead; this is
          # the same decision applied to the other way this step can fail to
          # produce an answer. The three statuses are therefore separated, and
          # anything that is not a clean match-or-no-match builds (#609).
          set +e
          grep -Eq '^(web/|\.github/workflows/|\.github/scripts/ci-preflight\.mjs$|\.github/skills/modeltree-gates/scripts/gate-(dataset|evidence|scope)\.mjs$|\.github/skills/modeltree-review/SKILL\.md$|\.github/ISSUE_TEMPLATE/|\.github/CODEOWNERS$|\.github/pull_request_template\.md$|CONTRIBUTING\.md$|docs/contributing/minimal-dataset-example\.json$|docs/product/INFORMATION-ARCHITECTURE\.md$|docs/product/FRESHNESS-POLICY\.md$|tools/updater/profiles/[^/]+\.[jJ][sS][oO][nN]$)' <<< "$changed"
          status=$?
          set -e

          case "$status" in
            0)
              echo "Files the web suite reads changed; running the full web build."
              echo "run=true" >> "$GITHUB_OUTPUT"
              ;;
            1)
              echo "Nothing the web suite reads changed; nothing to build."
              echo "run=false" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "Could not match the changed-file list (grep exited $status); running the full web build."
              echo "run=true" >> "$GITHUB_OUTPUT"
              ;;
          esac

      - name: Set up Node.js
        if: steps.scope.outputs.run == 'true'
        uses: actions/setup-node@v4
        with:
          # Kept identical to pages.yml: this check is only meaningful if it
          # builds on the same runtime the deploy uses.
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        if: steps.scope.outputs.run == 'true'
        run: npm ci

      # The three steps below are one check each, so a red run names what broke
      # instead of reporting a single opaque `npm run build`.
      #
      # They are not free-hand commands, and the equivalence they rest on is not
      # a claim of this comment. `npm run build` is `npm run validate && astro
      # build`, and `npm run validate` is `npm run test && npm run check`, so
      # test, then check, then build executes precisely the command list the
      # deploy executes. `web/tests/workflows/web-ci.test.ts` expands
      # web/package.json's scripts and asserts these steps decompose to exactly
      # `npm run build` -- so adding a stage to `validate`, or reordering these,
      # fails the suite rather than letting this check drift away from what
      # pages.yml gates the deploy on. That drift is the precise failure this
      # workflow exists to prevent, so keep one npm script per step and let that
      # test tell you when package.json has moved underneath it.
      - name: Run the web test suite
        if: steps.scope.outputs.run == 'true'
        run: npm run test

      - name: Check Astro and TypeScript diagnostics
        if: steps.scope.outputs.run == 'true'
        run: npm run check

      # `npm run astro -- build` rather than a bare `astro build`: npm appends
      # what follows `--` to the `astro` script, so this resolves the same local
      # binary through the same script runner that `npm run build` uses for its
      # own trailing `astro build`.
      - name: Build the production site
        if: steps.scope.outputs.run == 'true'
        run: npm run astro -- build

      # The vitest JSON report is the one artefact the console log does not
      # already carry: per-file results, and the exact input
      # verify-test-coverage.mjs judged when it decides a discovered file
      # produced no results. Nothing is uploaded by a green run.
      #
      # `path` is relative to the workspace root, not to the job's
      # working-directory default, which applies only to `run` steps.
      - name: Upload test diagnostics
        if: failure() && steps.scope.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: web-ci-test-report
          path: web/.vitest/report.json
          # A failure in the diagnostics or build step leaves the report from the
          # green test step in place, but a failure before the suite ran leaves
          # none. Missing diagnostics must not turn an already-red run into a
          # second, more confusing failure.
          if-no-files-found: ignore
          retention-days: 7

      - name: Record that no web build was needed
        if: steps.scope.outputs.run != 'true'
        run: |
          echo 'Nothing the web suite reads changed, so the site was not rebuilt.' >> "$GITHUB_STEP_SUMMARY"
