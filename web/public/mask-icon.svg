<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="ModelTree">
    <!-- Monochrome variant for Safari pinned tabs, which ignore colour and apply
         their own via `<link rel="mask-icon" color="...">`. Everything is painted
         black and the rounded ground is dropped: a mask icon is a silhouette, so a
         filled ground would mask the whole square and hide the mark inside it.

         Same geometry as `favicon.svg`, asserted by
         `src/components/brand-mark.test.ts`. -->
    <path d="M13 50V17l19 20 19-20v33M32 37V18" fill="none" stroke="#000000" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="13" cy="17" r="5.5" fill="#000000" />
    <circle cx="32" cy="15" r="5.5" fill="#000000" />
    <circle cx="51" cy="17" r="5.5" fill="#000000" />
</svg>
